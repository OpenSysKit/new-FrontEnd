name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build WinUI 3
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore OpenSysKit.UI.csproj

      - name: Publish unpackaged app
        id: publish
        continue-on-error: true
        run: >
          dotnet publish OpenSysKit.UI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:PublishSingleFile=false
          -o "${{ github.workspace }}\artifacts\win-x64"

      - name: Dump build diagnostics on failure
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Publish failed. Dumping likely XAML compiler artifacts..."
          Get-ChildItem -Recurse obj\Release -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          Get-ChildItem -Recurse obj\Release -Include *.json,*.log,*.err,*.txt -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "==== $($_.FullName) ===="
              Get-Content $_.FullName -ErrorAction SilentlyContinue
            }

      - name: Fail when publish did not succeed
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: |
          throw "dotnet publish failed"

      - name: Archive output
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts\OpenSysKit.UI-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\artifacts\win-x64\*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysKit-UI-win-x64
          path: artifacts/OpenSysKit.UI-win-x64.zip
          if-no-files-found: error
