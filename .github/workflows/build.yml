name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find csproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          echo "Found: $($proj.FullName)"
          echo "CSPROJ=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore "${{ env.CSPROJ }}"

      - name: Build
        run: dotnet build "${{ env.CSPROJ }}" --configuration Debug --no-restore

      - name: Publish
        run: >
          dotnet publish "${{ env.CSPROJ }}"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:ApplicationIcon=
          --output publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysKit-UI-win-x64
          path: publish/win-x64/OpenSysKit.UI.exe
          if-no-files-found: error

  release:
    name: Attach to Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenSysKit-UI-win-x64
          path: dist/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenSysKit.UI.exe