name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build WinUI 3
    runs-on: windows-latest
    env:
      Solution_Name: OpenSysKit.UI.csproj
      Configuration: Release
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

      - name: Publish unpackaged app
        id: publish
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild $env:Solution_Name `
            /t:Publish `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:WindowsPackageType=None `
            /p:EnableMsixTooling=true `
            /p:RuntimeIdentifierOverride=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugSymbols=false `
            /p:DebugType=None `
            /bl:$env:RUNNER_TEMP\publish.binlog

      - name: Dump build diagnostics on failure
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Publish failed. Dumping likely XAML compiler artifacts..."
          Get-ChildItem -Recurse obj\Release -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          $outputJson = Get-ChildItem -Recurse obj\Release -Filter output.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($outputJson) {
            Write-Host "==== Parsed output.json errors ===="
            $content = Get-Content $outputJson.FullName -Raw | ConvertFrom-Json
            $content.Errors | ConvertTo-Json -Depth 10
          }
          $inputJson = Get-ChildItem -Recurse obj\Release -Filter input.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($inputJson) {
            Write-Host "==== Parsed input.json page map ===="
            $content = Get-Content $inputJson.FullName -Raw | ConvertFrom-Json
            $content.XamlPages | Select-Object ItemSpec, ClassFullName | ConvertTo-Json -Depth 5
          }

      - name: Upload diagnostics on failure
        if: steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysKit-UI-build-diagnostics
          path: |
            ${{ runner.temp }}/publish.binlog
            obj/Release
          if-no-files-found: warn

      - name: Fail when publish did not succeed
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: |
          throw "dotnet publish failed"

      - name: Report published sizes
        if: steps.publish.outcome == 'success'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bin" -Filter "OpenSysKit.UI.exe" -File -Recurse |
            Select-Object -First 1
          if (-not $exe) {
            throw "Could not find OpenSysKit.UI.exe under bin"
          }
          $publishDir = Split-Path $exe.FullName -Parent
          Write-Host ("Executable size: {0} bytes" -f $exe.Length)
          Write-Host "Top published files by size:"
          Get-ChildItem -Path $publishDir -File -Force |
            Sort-Object Length -Descending |
            Select-Object -First 15 Name, Length |
            Format-Table -AutoSize

      - name: Archive output
        if: steps.publish.outcome == 'success'
        shell: pwsh
        run: |
          $artifactsDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null
          $archiveBase = Join-Path $artifactsDir "OpenSysKit.UI-win-x64"
          Get-ChildItem -Path $artifactsDir -Filter "OpenSysKit.UI-win-x64.*" -ErrorAction SilentlyContinue |
            Remove-Item -Force
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bin" -Filter "OpenSysKit.UI.exe" -File -Recurse |
            Select-Object -First 1
          if (-not $exe) {
            throw "Could not find OpenSysKit.UI.exe under bin"
          }
          $publishDir = Split-Path $exe.FullName -Parent
          $archiveItems = Get-ChildItem -Path $publishDir -Force |
            Where-Object { $_.Extension -ne '.pdb' } |
            Select-Object -ExpandProperty FullName
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($sevenZip) {
            Push-Location $publishDir
            try {
              & $sevenZip.Source a -t7z "$archiveBase.7z" "*" "-xr!*.pdb" -mx=9 -mmt=on -ms=on
            } finally {
              Pop-Location
            }
          } else {
            Compress-Archive -Path $archiveItems -DestinationPath "$archiveBase.zip" -CompressionLevel Optimal
          }

      - name: Upload artifact
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysKit-UI-win-x64
          path: artifacts/OpenSysKit.UI-win-x64.*
          if-no-files-found: error
