name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Avalonia win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file win-x64
        shell: pwsh
        run: |
          dotnet publish OpenSysKit.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:CETCompat=false `
            -o publish

      - name: Install UPX
        shell: pwsh
        run: |
          $upxVersion = "4.2.4"
          $url = "https://github.com/upx/upx/releases/download/v${upxVersion}/upx-${upxVersion}-win64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "upx.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "upx"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $upxDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          Write-Host "UPX installed at: $($upxDir.FullName)"
          echo "$($upxDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Report pre-UPX size
        shell: pwsh
        run: |
          $exe = Get-Item "publish\OpenSysKit.UI.exe"
          Write-Host ("Pre-UPX size: {0:N0} bytes ({1:N2} MB)" -f $exe.Length, ($exe.Length / 1MB))

      - name: Compress with UPX
        shell: pwsh
        run: |
          upx --best --lzma "publish\OpenSysKit.UI.exe"

      - name: Report post-UPX size
        shell: pwsh
        run: |
          $exe = Get-Item "publish\OpenSysKit.UI.exe"
          Write-Host ("Post-UPX size: {0:N0} bytes ({1:N2} MB)" -f $exe.Length, ($exe.Length / 1MB))

      - name: Archive output
        shell: pwsh
        run: |
          $artifactsDir = "artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null
          $items = Get-ChildItem publish -Force |
            Where-Object { $_.Extension -ne '.pdb' } |
            Select-Object -ExpandProperty FullName
          Compress-Archive -Path $items -DestinationPath (Join-Path $artifactsDir "OpenSysKit.UI-win-x64.zip") -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysKit-UI-win-x64
          path: artifacts/OpenSysKit.UI-win-x64.zip
          if-no-files-found: error

  trigger-backend:
    name: Trigger backend bundle
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch backend workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo OpenSysKit/BackEnd \
            --ref main
